<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F7FB"/>
      <stop offset="1" stop-color="#EEF1F8"/>
    </linearGradient>
    <radialGradient id="pinkL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(80 460) rotate(19) scale(270 210)">
      <stop stop-color="#F75A8C" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#F75A8C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1360 460) rotate(163) scale(280 210)">
      <stop stop-color="#F75A8C" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#F75A8C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topbar" x1="720" y1="0" x2="720" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F5FF"/>
      <stop offset="1" stop-color="#EAEFFA"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FAFCFF"/>
      <stop offset="1" stop-color="#EDF1F9"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="-10" dy="-10" stdDeviation="12" flood-color="#FFFFFF" flood-opacity="0.95"/>
      <feDropShadow dx="10" dy="10" stdDeviation="14" flood-color="#B8C0D8" flood-opacity="0.52"/>
    </filter>
    <filter id="edgeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1440" height="1024" fill="url(#bg)"/>
  <rect width="1440" height="1024" fill="url(#pinkL)"/>
  <rect width="1440" height="1024" fill="url(#pinkR)"/>

  <rect x="0" y="0" width="1440" height="64" fill="url(#topbar)"/>
  <rect x="0" y="63" width="1440" height="1" fill="#C8D1E6"/>

  <g filter="url(#soft)">
