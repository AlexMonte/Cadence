[workspace]
resolver = "3"
members = ["cadence", "musaic", "tessera"]

[workspace.package]
edition = "2024"
authors = ["AlexMonte <alexmonte@outlook.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates: depend on these from members via `{ workspace = true }`.
cadence = { path = "cadence" }
tessera = { path = "tessera" }
# `load_up` lives outside this workspace; the path is resolved from the workspace root.
load_up = { path = "../load_up/crates/load_up" }

# Shared third-party dependencies, unified across all member crates.
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
bevy_app = { version = "0.18.1", default-features = false, features = ["bevy_reflect"] }
bevy_ecs = { version = "0.18.1", default-features = false, features = ["bevy_reflect"] }
bevy_reflect = { version = "0.18.1", default-features = false }

[workspace.lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments, which would undesirably trigger this lint.
too_many_arguments = "allow"
# Queries may access many components, which would undesirably trigger this lint.
type_complexity = "allow"
# Make sure macros use their standard braces, such as `[]` for `bevy_ecs::children!`.
nonstandard_macro_braces = "warn"

# Profiles are only honored at the workspace root, so they live here rather than
# in any member crate.
#
# Dev strategy (Bevy-style):
# - Dependencies compile with opt-level 3 so hot paths in Bevy/crates.io stay fast.
# - Workspace members (musaic/cadence/tessera) also use opt-level 3 — they run every
#   frame (board sync, lowering, projection) and opt-level 1 made that painfully slow.
# - Use `--profile dev-fast` when iterating on local code and you want quicker rebuilds.

[profile.dev]
opt-level = 1
# Line tables only: enough for backtraces, faster than full debug info.
debug = 1
# On macOS, unpacked split debug info links much faster than bundled dSYM.
split-debuginfo = "unpacked"

# All dependencies compile optimized even in dev builds.
[profile.dev.package."*"]
opt-level = 3

# Hot workspace crates: keep fully optimized in the default dev profile.
[profile.dev.package.musaic]
opt-level = 3

[profile.dev.package.cadence]
opt-level = 3

[profile.dev.package.tessera]
opt-level = 3

[profile.dev.package.bevy]
opt-level = 3

[profile.dev.package.bevy_internal]
opt-level = 3

# Build scripts and proc-macros: compile optimized so they don't slow every rebuild.
[profile.dev.build-override]
opt-level = 3

# Faster iteration when editing local code; deps stay optimized via inherits = "dev".
[profile.dev-fast]
inherits = "dev"
codegen-units = 256

[profile.dev-fast.package.musaic]
opt-level = 0
codegen-units = 256

[profile.dev-fast.package.cadence]
opt-level = 0
codegen-units = 256

[profile.dev-fast.package.tessera]
opt-level = 0
codegen-units = 256

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

# This profile will be used for `bevy run web` automatically
[profile.web-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
