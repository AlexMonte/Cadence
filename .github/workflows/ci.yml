name: Cadence CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-and-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies for Tauri build/test
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cadence_frontend/package-lock.json

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked --version 0.7.1

      - name: Install frontend deps
        run: npm --prefix cadence_frontend ci

      - name: Install Playwright browser
        run: npm --prefix cadence_frontend exec playwright install --with-deps chromium

      - name: Dev check
        run: ./dev check
