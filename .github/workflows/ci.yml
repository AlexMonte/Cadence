name: Cadence CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-and-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies for Tauri build/test
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        run: npm --prefix ui ci

      - name: Build UI dist (freshness preflight)
        run: npm --prefix ui run build

      - name: Backend graph command tests
        run: cargo test -p src-tauri graph_commands -- --nocapture

      - name: Backend grid regression tests
        run: cargo test -p src-tauri grid_tests -- --nocapture

      - name: Install Playwright browser
        run: npm --prefix ui exec --package @playwright/test playwright install --with-deps chromium

      - name: UI smoke tests
        run: npm --prefix ui run test:e2e
