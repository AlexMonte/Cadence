[package]
name = "src-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rfd = "0.15"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
proptest = "1.6.0"
